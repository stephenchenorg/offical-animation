<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>錄影型舞台</title>
<!-- 舞台：左邊步驟標題、右邊網站視窗外框（真實畫面錄完會疊在 video.config.mjs 的 windows 位置）、下方字幕。
     顏色一律用主題變數（--bg、--fg…），深色主題插件才換得掉。window.S 的動作給分幕的 ctx.S() 呼叫。 -->
<style>
  :root {
    --bg: #eef2f7; --panel: #ffffff; --line: #d5dde8; --fg: #0f172a; --muted: #64748b;
    --accent: #2563eb; --sub-bg: rgba(15,23,42,.86); --sub-fg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif; }
  .side { position: absolute; left: 70px; top: 150px; width: 470px; }
  .no { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
  .title { font-size: 64px; font-weight: 900; line-height: 1.25; margin-top: 14px; transition: opacity .3s; }
  .frame { position: absolute; left: 586px; top: 106px; width: 1268px; height: 758px; border-radius: 18px;
    background: var(--panel); border: 2px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .frame::before { content: ""; position: absolute; left: 22px; top: 16px; width: 12px; height: 12px; border-radius: 50%;
    background: #f87171; box-shadow: 20px 0 #fbbf24, 40px 0 #34d399; }
  .sub { position: absolute; left: 0; right: 0; top: 905px; text-align: center; }
  .sub span { display: inline-block; max-width: 1500px; padding: 22px 44px; border-radius: 24px; background: var(--sub-bg);
    color: var(--sub-fg); font-size: 46px; font-weight: 700; line-height: 1.4; }
  .sub span:empty { display: none; }
  .end { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5;
    background: var(--bg); font-size: 72px; font-weight: 900; color: var(--accent); }
  .end.on { display: flex; }
</style>
</head>
<body>
  <div class="side"><div class="no" id="no"></div><div class="title" id="title"></div></div>
  <div class="frame"></div>
  <div class="sub"><span id="sub"></span></div>
  <div class="end" id="end"></div>
<script>
  const $ = id => document.getElementById(id)
  window.S = {
    reset() { $('no').textContent = ''; $('title').textContent = ''; $('sub').textContent = ''; $('end').className = 'end' },
    sub(text) { $('sub').textContent = text },
    step(n, title) { $('no').textContent = `STEP ${n}`; $('title').textContent = title },
    end(text) { $('end').textContent = text; $('end').className = 'end on' },
  }
</script>
</body>
</html>
